services:
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.native
    volumes: [queue-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/health]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      QUEUE_URL: http://queue:8081
      DB_PATH: /data/logs.db
      HOST: 0.0.0.0
    volumes: [log-data:/data]
    depends_on:
      queue: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      SIM_RATE: ${SIM_RATE:-5000}
    command: [node, --input-type=module, -e, "import {generate} from './simulator.mjs'; await generate('/events/events.ndjson',{rate:Number(process.env.SIM_RATE)});"]
    volumes: [events:/events]
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.native
    command: [log_agent, --file, /events/events.ndjson, --checkpoint, /data/agent.json, --queue-host, queue, --queue-port, '8081']
    volumes: [events:/events, agent-state:/data]
    depends_on:
      queue: {condition: service_healthy}
  anomaly:
    build:
      context: ..
      dockerfile: docker/Dockerfile.anomaly
    environment:
      POLL_INTERVAL_SECONDS: '2'
      BATCH_SIZE: '5000'
    volumes: [log-data:/data]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 30
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  queue-data:
  log-data:
  events:
  agent-state:
